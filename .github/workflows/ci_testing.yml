name: MEDIATA ORCHESTRATOR CI

on:
  push:
    branches: [dev, main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Test (with coverage)
        run: mvn -B -q verify

      - name: Generate coverage badge
        uses: cicirello/jacoco-badge-generator@v2
        with:
          generate-branches-badge: false

      - name: Prepare badges folder
        run: |
          mkdir -p badges
          mv .github/badges/jacoco.svg badges/coverage.svg

      - name: Commit coverage badge (if changed)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add badges/coverage.svg
          if ! git diff --cached --quiet; then
            git commit -m "ci: update coverage badge"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          else
            echo "Coverage badge unchanged"
          fi
